# 応援金の自動更新 (sekai-nina/meet-greet-app#2159)。
# Stripe の決済リンク経由の応援金 (手数料を引いた手取り) を 1 日 1 回 support-finances.json に反映する。
# 公開リポジトリなので、Stripe のキーを使うのは定時実行と手動実行だけ (= PR では動かさない)。
name: 応援金の自動更新

on:
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-support
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: node --test tests/*.test.*
      - name: Stripe から応援金を集計
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_SUPPORT_READ_KEY }}
        run: node scripts/update-support.mjs
      - name: 変わっていればコミットして配信
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- support-finances.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add support-finances.json
          git commit -m ':robot: 応援金を Stripe から自動更新'
          git push
          # GITHUB_TOKEN の push では Pages が再配信されない場合があるので明示的に頼む
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
